[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-ferry"
version = "0.4.2"
description = "LAN file sharing over WebSockets with mDNS discovery and a local web UI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "theluckytiger", email = "theluckytiger@users.noreply.github.com" },
]
keywords = ["file-transfer", "websocket", "mdns", "lan", "zeroconf", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=12.0",
    "zeroconf>=0.132.0",
    "rich>=13.0",
    "typer>=0.12.0",
    "qrcode>=8.0",
    "pillow>=10.0",
    "pystray>=0.19",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/theluckytiger/air-ferry"
Repository = "https://github.com/theluckytiger/air-ferry"
Issues = "https://github.com/theluckytiger/air-ferry/issues"

[project.scripts]
air-ferry = "air_ferry.cli:main"
air-ferry-tui = "air_ferry.cli:tui_app"

[tool.setuptools.packages.find]
include = ["air_ferry*"]

[tool.setuptools.package-data]
air_ferry = ["web/*"]
