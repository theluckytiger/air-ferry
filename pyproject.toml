[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-ferry"
version = "0.1.0"
description = "LAN file transfer over WebSockets with mDNS discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "theluckytiger", email = "theluckytiger@users.noreply.github.com" },
]
keywords = ["file-transfer", "websocket", "mdns", "lan", "zeroconf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Networking",
]
dependencies = [
    "websockets>=12.0",
    "zeroconf>=0.132.0",
    "rich>=13.0",
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/theluckytiger/air-ferry"
Repository = "https://github.com/theluckytiger/air-ferry"
Issues = "https://github.com/theluckytiger/air-ferry/issues"

[project.scripts]
air-ferry = "air_ferry.cli:app"

[tool.setuptools.packages.find]
include = ["air_ferry*"]
